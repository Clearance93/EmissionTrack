<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmissionTrack Insights Report</title>
    <link rel="stylesheet" href="/Style/insight.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <!-- Sidebar and Main Content -->
        <aside class="sidebar">
            <!-- Sidebar Content (Navigation, Footer) -->
        </aside>
        <main class="content">
            <!-- Main Content (Insights and Charts) -->
            <section class="insights">
                <!-- Emission Insights -->
                <div class="row">
                    <div class="col-md-4">
                        <!-- Emission Stats -->
                        <div class="insights-stats">
                            <div class="stat">
                                <img src="/Images/reduction.png" alt="Emission reduction">
                                <p>Description of reduction stat</p>
                            </div>
                            <div class="stat">
                                <img src="/Images/production.png" alt="Emission production">
                                <p>Description of production stat</p>
                            </div>
                            <div class="stat">
                                <img src="/Images/Avoided.png" alt="Emission avoided">
                                <p>Description of avoided stat</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-8">
                        <!-- Compliance Chart -->
                        <div class="chart">
                            <img src="/Images/compliance.png" alt="Compliance Chart">
                            <p>Description of compliance chart</p>
                        </div>
                    </div>
                </div>
                <!-- Additional Insights Charts -->
                <div class="insights-charts">
                    <div class="chart">
                        <img src="/Images/each company.png" alt="Scope Company Chart">
                        <p>Description of company scope chart</p>
                    </div>
                    <div class="chart">
                        <img src="/Images/Enegy used.png" alt="Energy Used Chart">
                        <p>Description of energy used chart</p>
                    </div>
                </div>
                <!-- Button for Report Generation -->
                <div class="button">
                    <button type="submit">Create Report</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
