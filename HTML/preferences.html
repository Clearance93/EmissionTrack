<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/Style/preference.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Profile</title>
</head>
<body>
   <div class="container">
    <aside class="sidebar">
        <div class="logo"><img src="/Images/EmissionTrack 1.png" alt="EmissionTrack"></div>
        <nav>
            <ul id="navbar">
                <li><i class="bi bi-house-door"></i><a href="/HTML/Dashboard.html"> Dashboard</a></li>
                <li><i class="bi bi-bar-chart"></i><a href="/HTML/Insight.html"> Insights</a></li>
                <li><i class="bi bi-upload"></i><a href="/HTML/upload.html"> Uploads</a></li>
                <li><i class="bi bi-globe-americas"></i><a href="/HTML/Offesting.html"> Carbon Offsetting Market</a></li>
                <li><i class="bi bi-tags"></i><a href="/HTML/Pricing.html"> Pricing</a></li>
                <li><i class="bi bi-chat-left-text"></i><a href="/HTML/Messages.html"> Direct Message</a></li>
            </ul>
            
        </nav>
        <footer>
            <div class="active"><i class="bi bi-person"></i><a href="/HTML/Profile.html"> Profile</a></div>
            <div><i class="bi bi-telephone-inbound"></i><a href="/HTML/contactUs.html"> Contact Us</a></div>
            <div><i class="bi bi-box-arrow-in-right"></i><a href="/HTML/login.html"> Logout</a></div>
        </footer>
    </aside>
    <div class="content">
        <div class="profile-header">
            <a href="#"><i class="bi bi-caret-left"></i>Back</a>
            <h5>Preferences</h5>
        </div>
        <div class="row">
            <div class="col-md-4">
                <div class="profile-info">
                    <div class="personal-info">
                        <ul>
                            <li class="active"><a href="/HTML/Profile.html"><i class="bi bi-person"></i> Personal Info</a></li>
                            <li><a href="/HTML/Checkout.html"><i class="bi bi-wallet2"></i> Payment details</a></li>
                            <li><a href="/HTML/OrderHistory.html"><i class="bi bi-lock"></i> Order history</a></li>
                            <li><a href="/HTML/preferences.html"><i class="bi bi-sliders"></i> Preferences</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="content">
                    <div class="profile-header">
                    </div>
                    <div class="preferences">
                        <form id="preferencesForm">
                            <div class="form-group">
                                <label for="theme">Theme</label>
                                <select id="theme" class="form-control">
                                    <option value="light">Light</option>
                                    <option value="dark">Dark</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="notifications">Notifications</label>
                                <select id="notifications" class="form-control">
                                    <option value="enabled">Enabled</option>
                                    <option value="disabled">Disabled</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="language">Language</label>
                                <select id="language" class="form-control">
                                    <option value="english">English</option>
                                    <option value="zulu">Zulu</option>
                                    <option value="pedi">Pedi</option>
                                    <option value="afrikaans">Afrikaans</option>
                                    <option value="xhosa">Xhosa</option>
                                    <option value="tsonga">Tsonga</option>
                                    <option value="venda">Venda</option>
                                    <option value="ndebele">Ndebele</option>
                                    <option value="sotho">Sotho</option>
                                    <option value="tswana">Tswana</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="timezone">Timezone</label>
                                <select id="timezone" class="form-control">
                                    <option value="GMT">GMT</option>
                                    <option value="EST">EST</option>
                                    <option value="CST">CST</option>
                                    <option value="PST">PST</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-primary">Save Preferences</button>
                        </form>
                    </div>
                </div>
               </div>
            </div>
        </div>
    </div>
   </div>

   <script src="/Script/preference.js"></script>
</body>
</html>
